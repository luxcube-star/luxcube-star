name: Build IPA (AltStore)

# 개인 설치용 .ipa 를 만든다. 서명하지 않은 빌드라 그대로는 설치되지 않고,
# AltStore 가 설치할 때 사용자의 Apple 계정으로 다시 서명한다.
# 결과물은 실행 페이지 아래 Artifacts 의 "MoaPlusRecommend-ipa" 에서 내려받는다.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project MoaPlus.xcodeproj \
            -scheme MoaPlus \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/MoaPlus.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package IPA
        run: |
          APP=$(find build/MoaPlus.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::아카이브에서 .app 을 찾지 못했습니다."
            exit 1
          fi
          echo "앱: $APP"
          ls "$APP/PlugIns" || echo "::warning::키보드 익스텐션(PlugIns)이 없습니다."
          # AltStore/AltServer 는 기본 Info.plist 이름으로 App ID 를 등록한다 — 영문·숫자·공백만 허용.
          for bundle in "$APP" "$APP"/PlugIns/*.appex; do
            NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$bundle/Info.plist" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$bundle/Info.plist")
            echo "이름: $bundle → $NAME"
            if ! printf '%s' "$NAME" | grep -Eq '^[A-Za-z0-9 ]+$'; then
              echo "::error::$bundle 의 이름 '$NAME' 에 App ID 로 쓸 수 없는 글자가 있습니다."
              exit 1
            fi
            if [ -f "$bundle/ko.lproj/InfoPlist.strings" ]; then
              echo "한국어 이름:"; plutil -p "$bundle/ko.lproj/InfoPlist.strings"
            else
              echo "::warning::$bundle 에 ko.lproj/InfoPlist.strings 가 없습니다 (한국어 이름이 안 보임)."
            fi
          done
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MoaPlusRecommend.ipa Payload
          ls -la MoaPlusRecommend.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MoaPlusRecommend-ipa
          path: MoaPlusRecommend.ipa
          retention-days: 30

  unit-tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select simulator
        id: simulator
        run: |
          SELECTED=""
          for device in "iPhone 17 Pro" "iPhone 17" "iPhone 16 Pro" "iPhone 16"; do
            if xcrun simctl list devices available | grep -q "$device ("; then
              SELECTED="$device"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            SELECTED=$(xcrun simctl list devices available \
              | grep -oE 'iPhone [0-9]+( Pro( Max)?)?( \()' \
              | sed 's/ ($//' | sort -V | tail -n 1)
          fi
          if [ -z "$SELECTED" ]; then
            echo "::error::사용 가능한 iPhone 시뮬레이터를 찾지 못했습니다."
            exit 1
          fi
          echo "device=$SELECTED" >> $GITHUB_OUTPUT

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project MoaPlus.xcodeproj \
            -scheme MoaPlus \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            -only-testing:MoaPlusKeyboardTests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            -quiet

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults.xcresult
          retention-days: 7
